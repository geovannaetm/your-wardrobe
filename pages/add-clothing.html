<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Clothing | Closet 2000</title>
	<link rel="stylesheet" href="../css/addClothing.css">

	<!--Fontes-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
		rel="stylesheet">
</head>
<body>
	<header>
		<nav  class="add-clothing-nav" aria-label="Navegação principal">
			<h1>ADD NEW CLOTHING</h1>
			<div class="close-clothing-link" id="add-clothing-link">
			<a href="home.html">X</a>
			</div>
		</nav>
	</header>

	<main>
		<form>
			<div class="form-layout">
				<div class="form-fields">
			<div class="clothing-name">
				<label for="clothing-name">Name:</label>
				<input id="clothing-name" name="name" type="text" required>
			</div>

			<fieldset class="clothing-type" aria-label="Tipo de roupa">
				<legend>Category:</legend>
				<label class="radio-container">
					<input name="type" type="radio" value="cima" required>
					<span class="custom-radio" aria-hidden="true"></span>
					<span>Top</span>
				</label>
				<label class="radio-container">
					<input name="type" type="radio" value="baixo">
					<span class="custom-radio" aria-hidden="true"></span>
					<span>Bottom</span>
				</label>
			</fieldset>

			<div class="carrossel-Item" aria-roledescription="carousel" aria-label="Item de roupas">
				<h4>Item of clothing:</h4>
				<div class="carrossel-controles">
					<ion-icon name="chevron-back-outline"></ion-icon>
					<!-- Trilho onde as palavras ficam alinhadas -->
					<div class="carrossel-trilho" id="clothing-Item">
						<!-- Palavras individuais -->

						<span class="carrossel-item" value="shirt" aria-hidden="false">Shirt</span>
						<!--
						<span class="carrossel-item" value="coat" aria-hidden="true">Coat</span>
						<span class="carrossel-item" value="skirt" aria-hidden="true">Skirt</span>
						<span class="carrossel-item" value="pants" aria-hidden="true">Pants</span>
						-->
					</div>
					<ion-icon name="chevron-forward-outline"></ion-icon>
				</div>
			</div>

			<div class="carrossel-Categoria" aria-roledescription="carousel" aria-label="categorias de roupas">
				<span>Style:</span>
				<div class="carrossel-controles">
					<ion-icon name="chevron-back-outline"></ion-icon>
					<!-- Trilho onde as palavras ficam alinhadas -->
					<div class="carrossel-trilho">
						<!-- Palavras individuais -->

						<span class="carrossel-categoria" value="casual" aria-hidden="false">CASUAL</span>
						<!--
						<span class="carrossel-categoria" value="elegante" aria-hidden="true">ELEGANTE</span>
						<span class="carrossel-categoria" value="social" aria-hidden="true">SOCIAL</span>
						<span class="carrossel-categoria" value="verão" aria-hidden="true">VERÃO</span>
						<span class="carrossel-categoria" value="yk2" aria-hidden="true">YK2</span>
						-->
					</div>
					<ion-icon name="chevron-forward-outline"></ion-icon>
				</div>
			</div>
				</div>
			
				<div class="image-upload">
				<label for="clothing-image">IMAGE OF YOUR OUTFIT</label>
				<input id="clothing-image" name="image" type="file" accept="image/*">

				<label class="image-preview" id="image-preview" for="clothing-image" aria-live="polite">
					<span>INSIRA A IMAGEM</span>
				</label>
				</div>
			</div>

			<button class="add-action add-action-save" type="submit">SAVE</button>
		</form>
	</main>

	<footer class="footer"></footer>

	<script type="module" src=" https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js "> </script>
	<script nomodule src=" https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js "> </script>
	<script src="../js/add-clothing.js"></script>
</body>
</html>
