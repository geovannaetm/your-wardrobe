<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Clothing | Closet 2000</title>
	<link rel="stylesheet" href="../css/addClothing.css">

	<!--Fontes-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
		rel="stylesheet">
</head>
<body>
	<header>
		<nav  class="add-clothing-nav" aria-label="Navegação principal">
			<h1>ADD NEW CLOTHING</h1>
			<div class="close-clothing-link" id="add-clothing-link">
			<a href="home.html">X</a>
			</div>
		</nav>
	</header>

	<main>
		<form>
			<div>
				<label for="clothing-name">Nome da roupa</label>
				<input id="clothing-name" name="name" type="text" required>
			</div>

			<fieldset>
				<legend>Tipo de peça</legend>
				<label><input name="type" type="radio" value="cima" required> Parte de cima</label>
				<label><input name="type" type="radio" value="baixo"> Parte de baixo</label>
			</fieldset>

			<div>
				<label for="clothing-category">Categoria</label>
				<select id="clothing-category" name="category" required>
					<option value="">Selecione uma categoria</option>
					<option value="casual">Casual</option>
					<option value="elegante">Elegante</option>
					<option value="social">Social</option>
				</select>
			</div>

			<div>
				<label for="clothing-image">Imagem</label>
				<input id="clothing-image" name="image" type="text" placeholder="assets/roupas/nome-da-imagem.png">
			</div>

			<button type="submit">Adicionar roupa</button>
		</form>
	</main>
</body>
</html>
